<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>Activities — Donna Mae Lat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    #activities {
      min-height: 100vh;
      background: transparent;
    }
    #activities .tab-corner-grid {
      height: 100%;
    }
    .footer { border-top: none; }
  </style>
</head>
<body class="fade-in-page">

  <div id="navbar-placeholder"></div>

  

  <!-- Activities Section -->
  <section class="projects" id="activities" style="position: relative; overflow: hidden; padding-top: 188px;">
    <div class="tab-corner-grid grid-top-center"></div>
    <div class="container" style="position: relative; z-index: 1;">
      <div class="section-header text-start reveal-left">
        <p class="section-eyebrow">Web Development</p>
        <h2 class="section-heading">Hands-on <em>activities.</em></h2>
      </div>

      <div class="projects-fan" id="activitiesFan">

        <!-- Activity 1 -->
        <div class="bento-1 project-card-wrap">
          <div class="project-card h-100 reveal-bottom">
            <div class="project-card-img">
                <img src="assets/img/bento-todo.png" alt="Bento To-Do preview" class="w-100 h-100" style="min-height: 220px; object-fit: cover; object-position: top;">
            </div>
            <div class="project-card-body">
              <div class="project-tags">
                <span class="tag">Activity #1</span>
                <span class="tag">Bootstrap</span>
                <span class="tag">Bento Layout</span>
              </div>
              <h3 class="project-title">Bento Layout Website</h3>
              <p class="project-desc">A bento-style website built with Bootstrap rows and columns, using static data only.</p>
              <a href="https://donnamaelat.github.io/web-dev-activities/Bento-Layout/" target="_blank" rel="noopener" class="project-link">View Activity →</a>
              
            </div>
          </div>
        </div>

      </div>

      
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-logo">DML<span>.</span></span>
      <p class="footer-tag">Intuition, Engineered.</p>
      <p class="footer-copy">© 2026 Donna Mae Lat. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
